# Refreshes public.ticker_snapshots (US symbol list, price, 52-week range,
# volatility, company names) for the create form. Separate from
# evaluate-theses.yml on purpose: a snapshot problem must never delay or fail
# grading.
#
# A normal night is ~1 Finnhub call and ~2 Massive calls (a few minutes). The
# first run downloads a year of daily history at Massive's free 5 calls/minute,
# capped per run (MASSIVE_CALL_BUDGET), so it completes over two nights.

name: Refresh Ticker Snapshots

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC — after US close, before the 06:00 evaluator
  workflow_dispatch:

# Shared with the other Finnhub workflow: GitHub runs them one at a time, so
# their separately-paced calls can never stack past the 60/min free tier.
concurrency:
  group: finnhub-api
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: data-service
        run: pip install -r requirements.txt

      - name: Refresh snapshots
        working-directory: data-service
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python refresh_snapshots.py
