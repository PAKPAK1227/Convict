# Refreshes public.ticker_snapshots (price, 52-week range, company names, the
# US symbol list) for the create form. Separate from evaluate-theses.yml on
# purpose: a snapshot problem must never delay or fail grading.
#
# ~500 tickers x 2 calls, throttled to the Finnhub free tier (60/min), takes
# roughly 20 minutes — longer on the first run, which also fetches company
# names once per ticker.

name: Refresh Ticker Snapshots

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC — after US close, before the 06:00 evaluator
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: data-service
        run: pip install -r requirements.txt

      - name: Refresh snapshots
        working-directory: data-service
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python refresh_snapshots.py
